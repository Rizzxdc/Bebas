<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Ucapan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .35);
            z-index: -1;
        }

        /* KANVAS EFEK */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 999;
        }

        /* ================= LOADING ================= */
        #loading {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .loading-icon {
            font-size: 48px;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulseIcon 1.8s infinite ease-in-out;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .loading-text {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #ffd700, #ff6b9d, #c77dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-text span {
            -webkit-text-fill-color: #fff;
            color: #fff;
            opacity: 0.8;
        }

        .bar {
            width: 100%;
            max-width: 280px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 auto 25px auto;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff6b9d, #c77dff);
            border-radius: 20px;
            animation: loading 4s ease-in-out forwards;
            position: relative;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        .info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 15px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .info .heart {
            color: #ff4d6d;
            display: inline-block;
            animation: heartBeat 1.4s infinite;
        }

        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.2);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.15);
            }
            60% {
                transform: scale(1);
            }
        }

        /* ================= SURAT ================= */
        #surat {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .envelope {
            font-size: 120px;
            cursor: pointer;
            transition: .3s;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 8px 25px rgba(0, 0, 0, 0.3));
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .envelope:hover {
            transform: scale(1.08) rotate(-5deg);
            filter: drop-shadow(0 12px 35px rgba(255, 77, 109, 0.4));
        }

        .petunjuk {
            color: rgba(255, 255, 255, 0.9);
            margin-top: 18px;
            transition: opacity 0.3s ease;
            font-weight: 400;
            letter-spacing: 1px;
            font-size: 18px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .card {
            display: none;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            padding: 30px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: show .6s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h2 {
            color: #ff4d6d;
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #444;
            line-height: 1.9;
            font-size: 15px;
        }

        /* TOMBOL & BAGIAN FOTO */
        .btn-selanjutnya {
            display: none;
            margin-top: 22px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #ff4d6d, #e6395c);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s ease;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.35);
            letter-spacing: 0.5px;
        }

        .btn-selanjutnya:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 77, 109, 0.45);
        }

        #bagianFoto {
            display: none;
            margin-top: 0;
            animation: show .6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .foto-tambahan {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .teks-foto {
            margin-top: 18px;
            color: white;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.8;
            padding: 0 10px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .pilihan {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
        }

        .btn-terima,
        .btn-tolak {
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all .3s ease;
            letter-spacing: 0.5px;
        }

        .btn-terima {
            background: linear-gradient(135deg, #4CAF50, #43a047);
            color: white;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.35);
        }

        .btn-terima:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.45);
        }

        .btn-tolak {
            background: linear-gradient(135deg, #ff4d6d, #e6395c);
            color: white;
            box-shadow: 0 8px 25px rgba(255, 77, 109, 0.3);
            position: relative;
        }

        .btn-tolak:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 77, 109, 0.4);
        }

        #hasilTerima {
            display: none;
            color: white;
            font-size: 22px;
            margin-top: 25px;
            font-weight: 600;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
            animation: show .6s cubic-bezier(0.23, 1, 0.32, 1);
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(5px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .loading-text {
                font-size: 22px;
            }
            .envelope {
                font-size: 90px;
            }
            .card {
                padding: 22px 18px;
            }
            .btn-terima,
            .btn-tolak {
                padding: 12px 24px;
                font-size: 14px;
            }
            .foto-tambahan {
                max-height: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Video -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="https://files.catbox.moe/y548q9.mp4" type="video/mp4">
    </video>

    <!-- KANVAS EFEK -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- LOADING -->
    <div id="loading">
        <div class="loading-icon">✨</div>
        <div class="loading-text">
            Loding<span>...</span>
        </div>
        <div class="bar">
            <div class="fill"></div>
        </div>
        <div class="info">
            <span class="heart">❤️</span> Sedikit Sabar Ya <span class="heart">❤️</span>
        </div>
    </div>

    <!-- ISI UTAMA -->
    <div id="surat">

        <!-- AMPLOP & PETUNJUK -->
        <div id="tampilanAwal">
            <div class="envelope" onclick="bukaSurat()">💌</div>
            <h3 class="petunjuk" id="petunjukBuka">
                Klik Surat Untuk Membukanya
            </h3>
        </div>

        <!-- KARTU SURAT -->
        <div id="wadahSurat">
            <div class="card" id="card">
                <h2>💖 Hai!</h2>
                <p>
                    Terima Kasih Udah Membuka Ini.<br><br>
                    Dari awal Aku,
                    🌸✨
                </p>
            </div>
            <button class="btn-selanjutnya" id="btnLanjut" onclick="tampilkanFoto()">➡️ Selanjutnya</button>
        </div>

        <!-- BAGIAN FOTO & TEKS -->
        <div id="bagianFoto">
            <img src="https://files.catbox.moe/hezvwn.jpg" alt="Foto Kenangan" class="foto-tambahan" id="gantiFoto">
            <p class="teks-foto" id="gantiTeks">
                Ini Aku sebener Nya tuh ada Rasa
                Aku suka sama kamu sebener nya 🥰<br>
                Terima kasih sudah sampai di sini ✨
            </p>
            <div class="pilihan" id="pilihan">
                <button class="btn-terima" onclick="terimaCinta()">❤️ Terima</button>
                <button class="btn-tolak" id="btnTolak">❌ Tidak Terima</button>
            </div>
            <p id="hasilTerima">
                🥹 Yeayyy!! Makasih udah nerima aku ❤️✨
            </p>
        </div>
    </div>

    <script>
        // =============== LOADING & TRANSISI ===============
        setTimeout(() => {
            loading.style.display = "none";
            surat.style.display = "block";
        }, 4000);

        // =============== FUNGSI SURAT ===============
        function bukaSurat() {
            tampilanAwal.style.display = "none";
            card.style.display = "block";
            btnLanjut.style.display = "inline-block";
            mulaiKembangApi();
            mulaiKupuKupu();
        }

        function tampilkanFoto() {
            wadahSurat.style.display = "none";
            bagianFoto.style.display = "block";
        }

        // =============== LOGIKA EFEK KEMBANG API ===============
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let partikel = [];
        let kupuKupu = [];
        let warna = ['#ff4d6d', '#ffd700', '#ff6b9d', '#c77dff', '#38b000', '#00b4d8', '#ff9e00', '#ffffff'];
        let warnaKupu = ['#ffb3c1', '#ffd700', '#c77dff', '#a2d2ff', '#fdffb6', '#ff9f9f'];

        function ukurCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ukurCanvas();
        window.addEventListener('resize', ukurCanvas);

        class Partikel {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.sudut = Math.random() * Math.PI * 2;
                this.kecepatan = Math.random() * 5 + 1.5;
                this.meredup = Math.random() * 0.007 + 0.002;
                this.warna = warna[Math.floor(Math.random() * warna.length)];
                this.ukuran = Math.random() * 3.5 + 1.5;
                this.opasitas = 1;
                this.gravitasi = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += Math.cos(this.sudut) * this.kecepatan;
                this.y += Math.sin(this.sudut) * this.kecepatan + this.gravitasi;
                this.kecepatan *= 0.985;
                this.opasitas -= this.meredup;
                this.ukuran *= 0.995;
            }
            gambar() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.ukuran, 0, Math.PI * 2);
                ctx.fillStyle = this.warna;
                ctx.globalAlpha = this.opasitas;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // =============== LOGIKA KUPU-KUPU ===============
        class KupuKupu {
            constructor() {
                this.reset();
                this.sayapBuka = 0;
                this.arahKepakan = 1;
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.kecepatanX = (Math.random() - 0.5) * 1.5;
                this.kecepatanY = -(Math.random() * 1 + 0.5);
                this.ukuran = Math.random() * 12 + 10;
                this.warna = warnaKupu[Math.floor(Math.random() * warnaKupu.length)];
                this.ayun = Math.random() * Math.PI * 2;
                this.sudutAyun = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.ayun += this.sudutAyun;
                this.x += this.kecepatanX + Math.sin(this.ayun) * 0.8;
                this.y += this.kecepatanY;

                this.sayapBuka += 0.12 * this.arahKepakan;
                if (this.sayapBuka > 0.8) this.arahKepakan = -1;
                if (this.sayapBuka < 0.1) this.arahKepakan = 1;

                if (this.y < -50 || this.x < -50 || this.x > canvas.width + 50) {
                    this.reset();
                }
            }
            gambar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = this.warna;
                ctx.globalAlpha = 0.9;

                ctx.beginPath();
                ctx.ellipse(-this.ukuran / 2, 0, this.ukuran * this.sayapBuka, this.ukuran / 1.5, -0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(this.ukuran / 2, 0, this.ukuran * this.sayapBuka, this.ukuran / 1.5, 0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.ukuran / 7, this.ukuran / 1.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        function ledakan() {
            const tengahX = Math.random() * canvas.width;
            const tengahY = Math.random() * canvas.height / 1.6;
            const jumlah = 90 + Math.floor(Math.random() * 50);
            for (let i = 0; i < jumlah; i++) {
                partikel.push(new Partikel(tengahX, tengahY));
            }
        }

        function animasi() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < partikel.length; i++) {
                partikel[i].update();
                partikel[i].gambar();
                if (partikel[i].opasitas <= 0) {
                    partikel.splice(i, 1);
                    i--;
                }
            }

            for (let k of kupuKupu) {
                k.update();
                k.gambar();
            }

            requestAnimationFrame(animasi);
        }

        function mulaiKembangApi() {
            animasi();
            let hitung = 0;
            const totalLedakan = 22;
            const jeda = setInterval(() => {
                ledakan();
                hitung++;
                if (hitung >= totalLedakan) clearInterval(jeda);
            }, 360);
        }

        function mulaiKupuKupu() {
            for (let i = 0; i < 8; i++) {
                let k = new KupuKupu();
                k.y = Math.random() * canvas.height;
                kupuKupu.push(k);
            }
        }

        // =============== LOGIKA TOMBOL TOLAK ===============
        const btnTolak = document.getElementById("btnTolak");

        btnTolak.addEventListener("mouseover", pindah);
        btnTolak.addEventListener("click", pindah);

        function pindah() {
            const area = document.getElementById("bagianFoto");
            const maxX = area.clientWidth - btnTolak.offsetWidth;
            const maxY = 250;
            btnTolak.style.position = "absolute";
            btnTolak.style.left = Math.random() * maxX + "px";
            btnTolak.style.top = Math.random() * maxY + "px";
        }

        // =============== TERIMA ===============
        function terimaCinta() {
            document.getElementById("pilihan").style.display = "none";
            document.getElementById("hasilTerima").style.display = "block";
        }
    </script>

</body>
</html>
